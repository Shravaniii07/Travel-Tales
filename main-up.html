<html>
<head>
    <title>Travel-Tales Header</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 30px;
            background-color: #ffffff;
            border-bottom: 2px solid #ddd;
        }

        .logo-section {
            display: flex;
            align-items: center;
        }

        .logo-section img {
            border-radius: 50%;
            margin-right: 20px;
        }

        .logo-section h1 {
            font-size: 28px;
            color: #333;
            margin: 0;
        }

        .nav {
            display: flex;
            gap: 20px;
        }

        .nav a {
            text-decoration: none;
            color: #444;
            font-weight: bold;
            font-size: 16px;
        }

        .nav a:hover {
            color: #6495ED;
        }

        .auth-buttons button {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            margin-left: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .login {
            background-color: #eee;
        }

        .signup {
            background-color: #6495ED;
            color: white;
        }
    </style>
</head>

<body>

    <div class="header">
        
        <!-- Logo + Title -->
        <div class="logo-section">
            <img src="symbol.png" width="100" height="100">
            <h1>Travel-Tales</h1>
        </div>

        <!-- Navigation Links -->
        <div class="nav">
            <a href="index.html">Home</a>
            <a href="#">Flights</a>
            <a href="#">Hotels</a>
            <a href="#">Packages</a>
            <a href="#">Contact</a>
        </div>

        <!-- Login & Signup -->
        <div class="auth-buttons">
            <button class="login">Login</button>
            <button class="signup">Sign Up</button>
        </div>
    </div>

</body>
</html>
